<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Školica — Regionalni Kviz & Otključaj Rečenicu</title>
  <style>
    :root {
      --bg-chalk: #16221c;
      --bg-chalk-2: #1e2f27;
      --chalk-white: #f4f1e6;
      --chalk-muted: #d1ccc0;
      --chalk-gold: #f5c451;
      --chalk-mint: #57d69a;
      --chalk-coral: #ff7b6b;
      --chalk-sky: #6bc5ff;
      --panel-bg: rgba(255, 250, 240, 0.97);
      --panel-text: #16201b;
      --panel-muted: #47554e;
      --border-soft: rgba(244, 241, 230, 0.22);
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --font-scale: 1.12;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(87, 214, 154, 0.12), transparent 36%),
        radial-gradient(circle at 82% 8%, rgba(245, 196, 81, 0.12), transparent 34%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 2px,
          transparent 2px,
          transparent 24px
        ),
        linear-gradient(160deg, var(--bg-chalk), var(--bg-chalk-2));
      color: var(--chalk-white);
      overflow-x: hidden;
    }

    .app-wrap {
      max-width: 1020px;
      margin: 0 auto;
      padding: 16px 16px 52px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(12, 20, 16, 0.78);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--chalk-gold), #e08d3c);
      color: #16221c;
      font-weight: 900;
      font-size: 22px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(245, 196, 81, 0.35);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.4px;
      color: var(--chalk-white);
    }

    .brand small {
      display: block;
      color: var(--chalk-muted);
      font-size: 0.85rem;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--chalk-white);
      font-weight: 700;
    }

    .pill strong {
      color: var(--chalk-gold);
    }

    .btn {
      border: none;
      border-radius: 13px;
      padding: 12px 17px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-gold {
      background: linear-gradient(135deg, #ffd166, #f4a226);
      color: #19221c;
    }

    .btn-mint {
      background: linear-gradient(135deg, #6ee7b7, #34d399);
      color: #112119;
    }

    .btn-sky {
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      color: #0e1e29;
    }

    .btn-coral {
      background: linear-gradient(135deg, #fca5a5, #f87171);
      color: #261010;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: var(--chalk-white);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .btn-sm {
      padding: 8px 13px;
      font-size: 0.88rem;
      border-radius: 11px;
      min-height: 38px;
    }

    .screen {
      display: none;
      margin-top: 16px;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chalk-card {
      background: rgba(14, 24, 19, 0.82);
      border: 2px dashed rgba(244, 241, 230, 0.3);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .paper-card {
      background: var(--panel-bg);
      color: var(--panel-text);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .hero-title {
      font-size: clamp(1.65rem, 3.8vw, 2.35rem);
      margin: 0 0 10px;
      color: var(--chalk-gold);
    }

    .hero-sub {
      margin: 0 0 16px;
      color: var(--chalk-muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 14px 0 20px;
    }

    .rule-box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 15px;
    }

    .rule-num {
      display: inline-block;
      background: var(--chalk-mint);
      color: #102018;
      font-weight: 900;
      font-size: 0.82rem;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .rule-box h3 {
      margin: 2px 0 6px;
      font-size: 1.08rem;
      color: var(--chalk-white);
    }

    .rule-box p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--chalk-muted);
      line-height: 1.45;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }

    .section-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--panel-muted);
      margin-bottom: 8px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice-btn {
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: var(--panel-text);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.14s ease;
    }

    .choice-btn.selected {
      border-color: #16a34a;
      background: #ecfdf5;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.18);
    }

    .input-text {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid #94a3b8;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--panel-text);
      background: #fff;
    }

    .emblem-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .emblem-btn {
      border: 2px solid #cbd5e1;
      background: #fff;
      border-radius: 12px;
      padding: 9px 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--panel-text);
    }

    .emblem-btn span.ico {
      display: block;
      font-size: 1.55rem;
      margin-bottom: 3px;
    }

    .emblem-btn.selected {
      border-color: #d97706;
      background: #fffbeb;
    }

    .tier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
      gap: 10px;
    }

    .tier-card {
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 13px;
      background: #fff;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .tier-card.selected {
      border-color: #0284c7;
      background: #f0f9ff;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.16);
    }

    .tier-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 1rem;
    }

    .tier-sub {
      font-size: 0.88rem;
      color: var(--panel-muted);
      margin-top: 4px;
      line-height: 1.35;
    }

    .track-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .fields-track {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .fields-track {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .field-node {
      border-radius: 12px;
      padding: 9px 4px;
      text-align: center;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 800;
      font-size: 0.88rem;
    }

    .field-node.done {
      background: rgba(87, 214, 154, 0.25);
      border-color: var(--chalk-mint);
      color: #a7f3d0;
    }

    .field-node.current {
      background: rgba(245, 196, 81, 0.25);
      border-color: var(--chalk-gold);
      color: var(--chalk-gold);
      transform: scale(1.04);
    }

    .field-node.missed {
      background: rgba(255, 123, 107, 0.22);
      border-color: var(--chalk-coral);
      color: #fecaca;
    }

    .category-tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: clamp(1.25rem, 2.8vw, 1.6rem);
      font-weight: 800;
      line-height: 1.42;
      margin: 0 0 18px;
      color: var(--panel-text);
    }

    .options-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .opt-btn {
      border: 2px solid #94a3b8;
      background: #ffffff;
      color: var(--panel-text);
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      min-height: 54px;
      transition: all 0.14s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .opt-btn.correct {
      border-color: #16a34a;
      background: #dcfce7;
      color: #14532d;
    }

    .opt-btn.wrong {
      border-color: #dc2626;
      background: #fee2e2;
      color: #7f1d1d;
    }

    .opt-btn.eliminated {
      opacity: 0.3;
      text-decoration: line-through;
